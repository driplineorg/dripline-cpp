name: Publish

on:
  push:
    branches: [ main, develop ]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      keep-test-image:
        description: "Keep the Test Image (set to 'true' to keep the image)"
        required: true
        default: "false"
      test-image-tag-suffix:
        description: "Suffix for Test Image Tag"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  REGISTRY_OLD: docker.io
  BASE_IMAGE_REPO: python
  BASE_IMAGE_TAG: '3.12.1-slim-bookworm'
  # Keep these in sync with the defaults in install_dependencies.sh
  BDE_VERSION: 4.39.0.0
  RMQCPP_REPO: https://github.com/driplineorg/rmqcpp.git
  RMQCPP_REF: 6f00fab8d4e5cd90f1548fc90679dcff8f3a753f

# narg/NARG (number-of-CPU argument to pass to the builds) are based on OS-specific CPU counts in the GitHub-hosted GHA runners.
# checked 1/4/2024: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources

jobs:

  test_docker:

    runs-on: ubuntu-22.04

    env:
      NARG: 2
      TAG: "gha-test${{ github.event.inputs.test-image-tag-suffix }}"
      INT_TAG: gha-int-test

    # This job runs for all events that trigger this workflow

    steps:

      - name: Concatenate env variables
        run: |
          echo "DL_CPP_TAG=${{ env.REGISTRY }}/${{ github.repository }}:${{ env.TAG }}" >> $GITHUB_ENV
          echo "DL_CPP_INT_TAG=${{ env.REGISTRY }}/${{ github.repository }}:${{ env.INT_TAG }}" >> $GITHUB_ENV

      - name: Checkout the repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GHCR
        # This condition should match the `push` condition in the `Build` step just below
        if: ${{ github.event.inputs.keep-test-image == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event.inputs.keep-test-image == 'true' }}
          load: true
          build-args: |
            img_user=${{ env.BASE_IMAGE_USER }}
            img_repo=${{ env.BASE_IMAGE_REPO }}
            img_tag=${{ env.BASE_IMAGE_TAG }}
            build_type=Debug
            build_examples=TRUE
            enable_testing=TRUE
            narg=${{ env.NARG }}
            bde_version=${{ env.BDE_VERSION }}
            rmqcpp_repo=${{ env.RMQCPP_REPO }}
            rmqcpp_ref=${{ env.RMQCPP_REF }}
          platforms: linux/amd64
          tags: ${{ env.DL_CPP_TAG }}

      - name: Build Integration Tests
        id: build_int_tests
        uses: docker/build-push-action@v7
        with:
          context: ./testing/integration
          push: false
          load: true
          build-args: |
            img_user=${{ env.REGISTRY }}/driplineorg
            img_repo=dripline-cpp
            img_tag=${{ env.TAG }}
          platforms: linux/amd64
          tags: ${{ env.DL_CPP_INT_TAG }}

      - name: Unit Tests
        run: |
          docker run --rm ${{ env.DL_CPP_INT_TAG }} bash -c "
            cd /usr/local/bin
            ./run_dl_tests"

      - name: Integration Tests
        run: |
          cd testing/integration
          ./run-dl-tests.sh ${{ env.INT_TAG }}
          ./run-broker-restart-test.sh ${{ env.INT_TAG }}

# For debugging
#      - name: Setup tmate session
#        if: ${{ ! success() }}
#        uses: mxschmitt/action-tmate@v3


  test_builds:

    runs-on: ${{ matrix.os }}

    # This job runs for all events that trigger this workflow

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        include:
          - os: ubuntu-22.04
            narg: 2
            # Ubuntu 22.04's libzstd-dev ships no CMake config package, which rmqcpp's
            # find_package(zstd CONFIG) requires, so compression support is left out
            dep_args: --no-compression
          - os: macos-latest
            narg: 3
            dep_args: ""


    steps:

      - name: Checkout the repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select CC version
        # Scarab requires GCC 12 or higher if using GCC
        # The default GCC for Ubuntu 22.04 is 11, but 12 is available
        # This can be removed once a newer Ubuntu version can be used
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      - name: Install system packages -- Mac
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install \
            rapidjson \
            yaml-cpp \
            boost \
            openssl@3 \
            zstd \
            ninja

      - name: Install system packages -- Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            rapidjson-dev \
            libyaml-cpp-dev \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-chrono-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            ninja-build

      - name: Cache the rmqcpp and BDE install
        # Building BDE takes a long time, and the result only changes when the pinned versions,
        # the build script, or the runner image change
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ~/dripline-deps
          key: dripline-deps-${{ matrix.os }}-${{ env.ImageVersion }}-${{ env.BDE_VERSION }}-${{ env.RMQCPP_REF }}-${{ hashFiles('install_dependencies.sh') }}

      - name: Build rmqcpp and BDE
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          ./install_dependencies.sh \
              --prefix="${HOME}/dripline-deps" \
              --jobs=${{ matrix.narg }} \
              --bde-version=${{ env.BDE_VERSION }} \
              --rmqcpp-repo=${{ env.RMQCPP_REPO }} \
              --rmqcpp-ref=${{ env.RMQCPP_REF }} \
              ${{ matrix.dep_args }}

      - name: Configure
        run: |
          # rmqcpp and BDE were installed to a non-standard prefix by the step above, and on
          # macOS the Homebrew prefix is not in CMake's default search path either
          PREFIX_PATH="${HOME}/dripline-deps"
          if [ "$(uname -s)" = "Darwin" ]; then
            PREFIX_PATH="${PREFIX_PATH};$(brew --prefix)"
          fi
          mkdir build
          cd build
          cmake -DScarab_BUILD_PYTHON=FALSE -DDripline_ENABLE_TESTING=TRUE \
              -DCMAKE_PREFIX_PATH="${PREFIX_PATH}" \
              ..

      - name: Build
        run: |
          cd build
          make -j${{ matrix.narg }} install

      - name: Run tests
        run: |
          cd build/testing
          ./run_dl_tests

# For debugging
#      - name: Setup tmate session
#        if: ${{ ! success() }}
#        uses: mxschmitt/action-tmate@v3


  build_and_push:

    runs-on: ubuntu-22.04

    env:
      NARG: 2
      # Scarab requires GCC 12 or higher, but Ubuntu 22.04 defaults to 11
      # This can be removed once a newer OS can be used
      CC: gcc-12
      CXX: g++-12

    # This job runs on push (limited above to develop, main and tags) and pull_requests marked read_for_review
    # Pushing images is limited below to push events
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    needs: [test_docker, test_builds]

    strategy:
      matrix:
        build: [dev, release]
        include:
          - build: dev
            build-type: DEBUG
            build-examples: 'TRUE'
            enable-testing: 'TRUE'
            tag-suffix: '-dev'
            do-integration: true
            int-tag-suffix: '-int-test'
          - build: release
            build-type: RELEASE
            build-examples: 'FALSE'
            enable-testing: 'FALSE'
            tag-suffix: ''
            do-integration: false
            int-tag-suffix: ''

    steps:

      - name: Checkout the repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_OLD }}/${{ github.repository }}
            ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads{0}', 'main') }}

      - name: Docker meta - integration
        id: docker_meta_integration
        if: ${{ matrix.do-integration }}
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.int-tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads{0}', 'main') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_OLD }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}  # limited to develop, main, and tags; don't push on PR
          build-args: |
            img_repo=${{ env.BASE_IMAGE_REPO }}
            img_tag=${{ env.BASE_IMAGE_TAG }}
            build_type=${{ matrix.build-type }}
            build_examples=${{ matrix.build-examples }}
            enable_testing=${{ matrix.enable-testing }}
            narg=${{ env.NARG }}
            bde_version=${{ env.BDE_VERSION }}
            rmqcpp_repo=${{ env.RMQCPP_REPO }}
            rmqcpp_ref=${{ env.RMQCPP_REF }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Build and push - integration
        id: build_push_integration
        if: ${{ matrix.do-integration }}
        uses: docker/build-push-action@v7
        with:
          context: ./testing/integration
          push: ${{ github.event_name == 'push' }}  # limited to develop, main, and tags; don't push on PR
          build-args: |
            img_user=${{ env.REGISTRY }}/driplineorg
            img_repo=dripline-cpp
            img_tag=latest-dev
          tags: ${{ steps.docker_meta_integration.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Release with a changelog
        uses: rasmus-saks/release-a-changelog-action@v1.2.0
        if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: 'changelog.md'
          title-template: 'dripline-cpp v{version} -- Release Notes'
          tag-template: 'v{version}'
