name: Publish

on:
  push:
    branches: [ main, develop ]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      keep-test-image:
        description: "Keep the Test Image (set to 'true' to keep the image)"
        required: true
        default: "false"
      test-image-tag-suffix:
        description: "Suffix for Test Image Tag"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  REGISTRY_OLD: docker.io
  BASE_IMAGE_REPO: python
  BASE_IMAGE_TAG: '3.12.1-slim-bookworm'
  # The pinned rmqcpp and BDE versions live in install_dependencies.sh; nothing here overrides them.
  # Bump CACHE_VERSION to discard the cached rmqcpp/BDE installs without touching the script.
  CACHE_VERSION: 1

# narg/NARG (number-of-CPU argument to pass to the builds) are based on OS-specific CPU counts in the GitHub-hosted GHA runners.
# checked 1/4/2024: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources

jobs:

  script_checks:

    runs-on: ubuntu-latest

    # This job runs for all events that trigger this workflow

    steps:

      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck install_dependencies.sh

      - name: Usage message
        run: ./install_dependencies.sh --help


  test_docker:

    runs-on: ubuntu-26.04

    env:
      NARG: 2
      TAG: "gha-test${{ github.event.inputs.test-image-tag-suffix }}"
      INT_TAG: gha-int-test

    # This job runs for all events that trigger this workflow

    steps:

      - name: Concatenate env variables
        run: |
          echo "DL_CPP_TAG=${{ env.REGISTRY }}/${{ github.repository }}:${{ env.TAG }}" >> $GITHUB_ENV
          echo "DL_CPP_INT_TAG=${{ env.REGISTRY }}/${{ github.repository }}:${{ env.INT_TAG }}" >> $GITHUB_ENV

      - name: Checkout the repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GHCR
        # This condition should match the `push` condition in the `Build` step just below
        if: ${{ github.event.inputs.keep-test-image == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event.inputs.keep-test-image == 'true' }}
          load: true
          build-args: |
            img_user=${{ env.BASE_IMAGE_USER }}
            img_repo=${{ env.BASE_IMAGE_REPO }}
            img_tag=${{ env.BASE_IMAGE_TAG }}
            build_type=Debug
            build_examples=TRUE
            enable_testing=TRUE
            narg=${{ env.NARG }}
          platforms: linux/amd64
          tags: ${{ env.DL_CPP_TAG }}
          # mode=max so that the expensive `base` stage (rmqcpp + BDE from source) is cached too.
          # Each build gets its own scope; they would otherwise evict each other.
          cache-from: type=gha,scope=dl-cpp-test
          cache-to: type=gha,mode=max,scope=dl-cpp-test

      - name: Build Integration Tests
        id: build_int_tests
        uses: docker/build-push-action@v7
        with:
          context: ./testing/integration
          push: false
          load: true
          build-args: |
            img_user=${{ env.REGISTRY }}/driplineorg
            img_repo=dripline-cpp
            img_tag=${{ env.TAG }}
          platforms: linux/amd64
          tags: ${{ env.DL_CPP_INT_TAG }}
          cache-from: type=gha,scope=dl-cpp-int-test
          cache-to: type=gha,mode=min,scope=dl-cpp-int-test

      - name: Unit Tests
        run: |
          docker run --rm ${{ env.DL_CPP_INT_TAG }} bash -c "
            cd /usr/local/bin
            ./run_dl_tests"

      - name: Integration Tests
        run: |
          cd testing/integration
          ./run-dl-tests.sh ${{ env.INT_TAG }}
          ./run-broker-restart-test.sh ${{ env.INT_TAG }}

# For debugging
#      - name: Setup tmate session
#        if: ${{ ! success() }}
#        uses: mxschmitt/action-tmate@v3


  test_builds:

    runs-on: ${{ matrix.os }}

    # This job runs for all events that trigger this workflow

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]


    steps:

      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages -- Mac
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install \
            rapidjson \
            yaml-cpp \
            boost \
            openssl@3 \
            zstd \
            ninja

      - name: Install system packages -- Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            rapidjson-dev \
            libyaml-cpp-dev \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-chrono-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            ninja-build

      - name: Record the runner image version
        # $ImageVersion is a runner environment variable, so it is NOT available in the `env`
        # expression context.  It has to be copied into $GITHUB_ENV to be usable in the cache key.
        run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> $GITHUB_ENV

      - name: Cache the rmqcpp and BDE install
        # Building BDE takes a long time, and the result only changes when the build script (which
        # is also where the pinned versions live), the runner image, or CACHE_VERSION change.
        # Deliberately no restore-keys: a partial match would hand the build stale BDE archives.
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ~/dripline-deps
          key: dripline-deps-${{ env.CACHE_VERSION }}-${{ matrix.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('install_dependencies.sh') }}

      - name: Build rmqcpp and BDE
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          # --jobs is omitted so that the script auto-detects the runner's CPU count
          ./install_dependencies.sh --prefix="${HOME}/dripline-deps"

      - name: Verify the rmqcpp and BDE install
        # Runs on the cache-hit path too, where the build step above is skipped: a truncated cache
        # would otherwise surface as a confusing dripline-cpp configure failure
        run: ./install_dependencies.sh --prefix="${HOME}/dripline-deps" --verify-only

      - name: Configure
        run: |
          # rmqcpp and BDE were installed to a non-standard prefix by the step above, which recorded
          # the prefix path and the OpenSSL it resolved.  Sourcing that keeps dripline-cpp and
          # rmqcpp on the same OpenSSL.
          . "${HOME}/dripline-deps/dripline-deps.env"
          mkdir build
          cd build
          cmake -DScarab_BUILD_PYTHON=FALSE -DDripline_ENABLE_TESTING=TRUE \
              -DCMAKE_PREFIX_PATH="${DRIPLINE_DEPS_CMAKE_PREFIX_PATH}" \
              ${DRIPLINE_DEPS_OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="${DRIPLINE_DEPS_OPENSSL_ROOT_DIR}"} \
              ..

      - name: Build
        run: |
          cd build
          make -j$(getconf _NPROCESSORS_ONLN) install

      - name: Run tests
        run: |
          cd build/testing
          ./run_dl_tests

# For debugging
#      - name: Setup tmate session
#        if: ${{ ! success() }}
#        uses: mxschmitt/action-tmate@v3


  build_and_push:

    runs-on: ubuntu-26.04

    env:
      NARG: 2

    # This job runs on push (limited above to develop, main and tags) and pull_requests marked read_for_review
    # Pushing images is limited below to push events
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    needs: [script_checks, test_docker, test_builds]

    strategy:
      matrix:
        build: [dev, release]
        include:
          - build: dev
            build-type: DEBUG
            build-examples: 'TRUE'
            enable-testing: 'TRUE'
            tag-suffix: '-dev'
            do-integration: true
            int-tag-suffix: '-int-test'
          - build: release
            build-type: RELEASE
            build-examples: 'FALSE'
            enable-testing: 'FALSE'
            tag-suffix: ''
            do-integration: false
            int-tag-suffix: ''

    steps:

      - name: Checkout the repo 
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_OLD }}/${{ github.repository }}
            ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads{0}', 'main') }}

      - name: Docker meta - integration
        id: docker_meta_integration
        if: ${{ matrix.do-integration }}
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.int-tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads{0}', 'main') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_OLD }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}  # limited to develop, main, and tags; don't push on PR
          build-args: |
            img_repo=${{ env.BASE_IMAGE_REPO }}
            img_tag=${{ env.BASE_IMAGE_TAG }}
            build_type=${{ matrix.build-type }}
            build_examples=${{ matrix.build-examples }}
            enable_testing=${{ matrix.enable-testing }}
            narg=${{ env.NARG }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=dl-cpp-${{ matrix.build }}
          cache-to: type=gha,mode=max,scope=dl-cpp-${{ matrix.build }}

      - name: Build and push - integration
        id: build_push_integration
        if: ${{ matrix.do-integration }}
        uses: docker/build-push-action@v7
        with:
          context: ./testing/integration
          push: ${{ github.event_name == 'push' }}  # limited to develop, main, and tags; don't push on PR
          build-args: |
            img_user=${{ env.REGISTRY }}/driplineorg
            img_repo=dripline-cpp
            img_tag=latest-dev
          tags: ${{ steps.docker_meta_integration.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=dl-cpp-int-${{ matrix.build }}
          cache-to: type=gha,mode=min,scope=dl-cpp-int-${{ matrix.build }}

      - name: Release with a changelog
        uses: rasmus-saks/release-a-changelog-action@v1.2.0
        if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') }}
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          path: 'changelog.md'
          title-template: 'dripline-cpp v{version} -- Release Notes'
          tag-template: 'v{version}'
